{% extends "shell.html" %}
{% block content %}
<div class="head"><h1>Change password</h1></div>
<form method="post" class="form card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if current_user.must_change_password %}<div class="flash ok">Please set a new password to continue.</div>{% endif %}
  <div class="field"><label>Current password</label><input type="password" name="current" required autocomplete="current-password"></div>
  <div class="field"><label>New password (min 8)</label><input type="password" name="new" required minlength="8" autocomplete="new-password"></div>
  <button class="btn btn-gold">Update password</button>
</form>
{% endblock %}
