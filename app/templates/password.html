{% extends "shell.html" %}
{% block content %}
<div class="page-head"><h1>Change password</h1></div>
<form method="post" class="card card-body mw-form-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if current_user.must_change_password %}<div class="alert alert-info">Please set a new password to continue.</div>{% endif %}
  <div class="mb-3"><label class="form-label">Current password</label><input class="form-control" type="password" name="current" required autocomplete="current-password"></div>
  <div class="mb-3"><label class="form-label">New password (min 8)</label><input class="form-control" type="password" name="new" required minlength="8" autocomplete="new-password"></div>
  <button class="btn btn-primary align-self-start">Update password</button>
</form>
{% endblock %}
