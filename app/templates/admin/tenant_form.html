{% extends "shell.html" %}
{% block content %}
<div class="page-head"><h1>Register tenant</h1></div>
<form method="post" class="card card-body mw-form">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="mb-3"><label class="form-label">Organisation name</label><input class="form-control" type="text" name="name" required value="{{ form.name }}"></div>
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label class="form-label">Slug</label><input class="form-control" type="text" name="slug" required placeholder="acme-traders" value="{{ form.slug }}"></div>
    <div class="col-md-6"><label class="form-label">Plan</label><select class="form-select" name="plan">{% for k, p in plans.items() %}<option value="{{ k }}" {{ 'selected' if form.plan==k }}>{{ p.label }} (up to {{ p.max_users }} users)</option>{% endfor %}</select></div>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-md-6"><label class="form-label">Owner name</label><input class="form-control" type="text" name="owner" value="{{ form.owner }}"></div>
    <div class="col-md-6"><label class="form-label">Owner email (login)</label><input class="form-control" type="email" name="email" required value="{{ form.email }}"></div>
  </div>
  <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" type="text" name="phone" value="{{ form.phone }}"></div>
  <button class="btn btn-primary align-self-start">Create tenant</button>
</form>
{% endblock %}
