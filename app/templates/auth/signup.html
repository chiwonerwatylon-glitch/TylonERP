{% extends "layouts/base.html" %}

{% block title %}Sign Up - TylonERP{% endblock %}

{% block extra_css %}
<style>
    .signup-container {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0f172a, #1e293b);
        padding: 2rem;
    }
    
    .signup-card {
        width: 100%;
        max-width: 500px;
        padding: 3rem;
        background-color: #1e293b;
        border: 2px solid #334155;
        border-radius: 15px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
    }
    
    .signup-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .signup-header h2 {
        color: #e2e8f0;
        margin-bottom: 0.5rem;
    }
    
    .signup-header p {
        color: #94a3b8;
    }
    
    .form-group {
        margin-bottom: 1.5rem;
    }
    
    .form-label {
        font-weight: 600;
        color: #cbd5e1;
        margin-bottom: 0.5rem;
    }
    
    .form-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
    }
    
    .form-row .form-group {
        margin-bottom: 0;
    }
    
    .password-strength {
        margin-top: 0.5rem;
        height: 5px;
        background-color: #334155;
        border-radius: 3px;
        overflow: hidden;
    }
    
    .password-strength-bar {
        height: 100%;
        width: 0%;
        transition: width 0.3s;
    }
    
    .password-strength-bar.weak {
        width: 33%;
        background-color: #ef4444;
    }
    
    .password-strength-bar.fair {
        width: 66%;
        background-color: #f59e0b;
    }
    
    .password-strength-bar.strong {
        width: 100%;
        background-color: #10b981;
    }
    
    .btn-signup {
        width: 100%;
        padding: 0.75rem;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        color: white;
        font-weight: 600;
        border-radius: 8px;
        transition: all 0.3s;
        margin-top: 1.5rem;
    }
    
    .btn-signup:hover {
        transform: translateY(-2px);
        box-shadow: 0 15px 40px rgba(99, 102, 241, 0.3);
    }
    
    .terms {
        font-size: 0.85rem;
        color: #94a3b8;
        margin: 1rem 0;
        text-align: center;
    }
    
    .terms a {
        color: #6366f1;
        text-decoration: none;
    }
    
    .terms a:hover {
        text-decoration: underline;
    }
    
    .login-link {
        text-align: center;
        color: #94a3b8;
        margin-top: 1rem;
    }
    
    .login-link a {
        color: #6366f1;
        text-decoration: none;
        font-weight: 600;
    }
</style>
{% endblock %}

{% block content %}
<div class="signup-container">
    <div class="signup-card">
        <!-- Header -->
        <div class="signup-header">
            <h2>Create Account</h2>
            <p>Join TylonERP today</p>
        </div>
        
        <!-- Signup Form -->
        <form method="POST" action="/signup" id="signupForm">
            <!-- Company & Name Row -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Company Name</label>
                    <input type="text" class="form-control" name="company_name" placeholder="Your Company" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Your Name</label>
                    <input type="text" class="form-control" name="full_name" placeholder="Full Name" required>
                </div>
            </div>
            
            <!-- Email -->
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
            </div>
            
            <!-- Password Row -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Password</label>
                    <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required>
                    <div class="password-strength">
                        <div class="password-strength-bar" id="passwordStrengthBar"></div>
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Confirm Password</label>
                    <input type="password" class="form-control" name="confirm_password" placeholder="••••••••" required>
                </div>
            </div>
            
            <!-- Phone & Industry Row -->
            <div class="form-row">
                <div class="form-group">
                    <label class="form-label">Phone Number</label>
                    <input type="tel" class="form-control" name="phone" placeholder="+1 (555) 000-0000">
                </div>
                <div class="form-group">
                    <label class="form-label">Industry</label>
                    <select class="form-select" name="industry">
                        <option>Select industry...</option>
                        <option>Retail</option>
                        <option>Manufacturing</option>
                        <option>Distribution</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>
            
            <!-- Terms & Privacy -->
            <div class="form-check" style="margin: 1rem 0;">
                <input class="form-check-input" type="checkbox" id="terms" name="terms" required>
                <label class="form-check-label" for="terms" style="color: #94a3b8; font-size: 0.9rem;">
                    I agree to the <a href="/terms" style="color: #6366f1; text-decoration: none;">Terms of Service</a> and <a href="/privacy" style="color: #6366f1; text-decoration: none;">Privacy Policy</a>
                </label>
            </div>
            
            <!-- Signup Button -->
            <button type="submit" class="btn btn-signup">
                <i class="bi bi-person-check"></i> Create Account
            </button>
        </form>
        
        <!-- Login Link -->
        <div class="login-link">
            Already have an account? <a href="/login">Sign in here</a>
        </div>
    </div>
</div>

<script>
    // Password strength indicator
    document.getElementById('password').addEventListener('input', function(e) {
        const strength = calculatePasswordStrength(e.target.value);
        const bar = document.getElementById('passwordStrengthBar');
        bar.className = 'password-strength-bar ' + strength;
    });
    
    function calculatePasswordStrength(password) {
        if (password.length < 8) return 'weak';
        if (/[A-Z]/.test(password) && /[0-9]/.test(password)) return 'strong';
        return 'fair';
    }
</script>
{% endblock %}
