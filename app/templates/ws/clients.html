{% extends "shell.html" %}
{% block content %}
<div class="head"><h1>Clients</h1></div>
<form method="post" class="card" style="margin-bottom:20px"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<div class="two"><div class="field"><label>Name</label><input type="text" name="name" required></div><div class="field"><label>Phone</label><input type="text" name="phone"></div></div>
<div class="field"><label>Email</label><input type="email" name="email"></div><button class="btn btn-gold">Add client</button></form>
<div class="card table"><table><tr><th>Client</th><th>Contact</th><th>Owes</th></tr>
{% for c in items %}<tr><td>{{ c.name }}</td><td class="muted">{{ c.phone or '' }} {{ c.email or '' }}</td><td>{% if c.balance > 0 %}<span class="badge off">{{ '%.2f'|format(c.balance) }}</span>{% else %}<span class="badge ok">Clear</span>{% endif %}</td></tr>
{% else %}<tr><td colspan="3" class="muted">No clients yet.</td></tr>{% endfor %}</table></div>
{% endblock %}
