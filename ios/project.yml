# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: TylonERP
options:
  bundleIdPrefix: zw.co.tylonerp
  deploymentTarget:
    iOS: "15.0"
targets:
  TylonERP:
    type: application
    platform: iOS
    sources:
      - path: TylonERP
    scheme: {}
    info:
      path: TylonERP/Info.plist
      properties:
        CFBundleDisplayName: TylonERP
        CFBundleShortVersionString: "2.0.0"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        NSCameraUsageDescription: TylonERP uses the camera to scan barcodes and photograph products.
        NSPhotoLibraryUsageDescription: TylonERP lets you choose product pictures from your photos.
        NSPhotoLibraryAddUsageDescription: TylonERP saves exported files you choose to keep.
        ITSAppUsesNonExemptEncryption: false
        TylonServerURL: https://tylonerp.up.railway.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: zw.co.tylonerp.app
        PRODUCT_NAME: TylonERP
        MARKETING_VERSION: "2.0.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_BITCODE: NO
