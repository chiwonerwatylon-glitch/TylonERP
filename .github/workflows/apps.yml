name: Phone apps
# Builds the Android APK and the iPhone/iPad app, then publishes both on the repository's Releases page.
# Download them from https://github.com/<owner>/<repo>/releases/latest
on:
  push:
    branches: [master, modern-pos]
    paths: ["android/**", "ios/**", ".github/workflows/apps.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: phone-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Use your own signing key when one is set up as secrets
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "TYLON_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "::warning::Signing with the sideload key in android/. Add ANDROID_KEYSTORE_BASE64 and friends as secrets to use your own key."
          fi
      - name: Build the APK
        working-directory: android
        env:
          TYLON_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          TYLON_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          TYLON_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # Empty secrets must not override the defaults in build.gradle.kts
          [ -z "$TYLON_KEYSTORE_PASSWORD" ] && unset TYLON_KEYSTORE_PASSWORD
          [ -z "$TYLON_KEY_ALIAS" ] && unset TYLON_KEY_ALIAS
          [ -z "$TYLON_KEY_PASSWORD" ] && unset TYLON_KEY_PASSWORD
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease -PtylonVersionCode=$((100 + ${{ github.run_number }}))
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/TylonERP.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ${{ runner.temp }}/TylonERP.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        working-directory: ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build the app (unsigned)
        working-directory: ios
        run: |
          xcodebuild -project TylonERP.xcodeproj -scheme TylonERP -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/TylonERP.app Payload/
          zip -qry "$RUNNER_TEMP/TylonERP-iOS-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ${{ runner.temp }}/TylonERP-iOS-unsigned.ipa

  publish:
    needs: [android, ios]
    if: always() && needs.android.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish a release with the app files
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: apps-${{ github.run_number }}
          SHA: ${{ github.sha }}
          BRANCH: ${{ github.ref_name }}
        run: |
          ls -la dist
          cat > notes.md <<EOF
          Phone apps built from \`${BRANCH}\` at ${SHA}.

          **Android** — download \`TylonERP.apk\` on the phone, open it and allow "Install unknown apps" when asked.
          Later builds install over this one and keep the phone's data.

          **iPhone / iPad** — \`TylonERP-iOS-unsigned.ipa\` must be signed when it is installed, with Sideloadly or
          AltStore and your Apple ID (free Apple IDs need it re-signed every 7 days). For no sideloading at all, open
          your TylonERP sign-in link in Safari and choose Share > Add to Home Screen.
          EOF
          gh release create "$TAG" dist/* --repo "$REPO" --target "$SHA" --title "TylonERP phone apps #${{ github.run_number }}" --notes-file notes.md --latest
